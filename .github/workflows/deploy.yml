name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -eu
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR=/opt/image-pool-regs; fi
            DATA_DIR="${DEPLOY_DIR}-data"

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone https://github.com/FlyLjx/image-pool-regs.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            mkdir -p "$DATA_DIR"
            if [ ! -f "$DATA_DIR/accounts.json" ]; then
              cp -n data/*.json "$DATA_DIR"/
            fi

            if docker container inspect image-pool-flaresolverr >/dev/null 2>&1 \
              && docker network inspect image-pool_default >/dev/null 2>&1; then
              docker build -t image-pool-regs:latest .
              docker rm -f image-pool-regs >/dev/null 2>&1 || true
              docker run -d \
                --name image-pool-regs \
                --restart unless-stopped \
                --network image-pool_default \
                -p 8090:8090 \
                -e REG_DATA_DIR=/app/data \
                -e REG_FORCE_DIRECT=1 \
                -e REG_FLARESOLVERR_URL=http://image-pool-flaresolverr:8191 \
                -v "$DATA_DIR:/app/data" \
                image-pool-regs:latest
            else
              REG_DATA_DIR_HOST="$DATA_DIR" docker compose up -d --build --remove-orphans
            fi

            for attempt in $(seq 1 45); do
              STATUS="$(docker inspect --format='{{.State.Health.Status}}' image-pool-regs 2>/dev/null || true)"
              if [ "$STATUS" = healthy ]; then break; fi
              sleep 2
            done
            docker inspect --format='{{json .State.Health}}' image-pool-regs
            test "$(docker inspect --format='{{.State.Health.Status}}' image-pool-regs)" = healthy
